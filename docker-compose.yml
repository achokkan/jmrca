version: '3.8'

services:
  jmcra:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Spring Boot mappings
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      
      # JMCRA application properties
      - JMCRA_LLM_PROVIDER=claude
      - JMCRA_GITHUB_TOKEN=${GITHUB_TOKEN:-dummy_token}
      - JMCRA_SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/dummy}
      - JMCRA_JIRA_URL=${JIRA_URL:-https://jira.example.com}
      - JMCRA_JIRA_USERNAME=${JIRA_USERNAME:-automation}
      - JMCRA_JIRA_TOKEN=${JIRA_TOKEN:-dummy_token}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jmcra-net

networks:
  jmcra-net:
    driver: bridge

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=jmcra
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jmcra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jmcra-net

  jmcra:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_HOST=db
      - JMCRA_LLM_PROVIDER=STUB
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jmcra-net

networks:
  jmcra-net:
    driver: bridge

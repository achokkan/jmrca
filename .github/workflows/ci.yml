name: JMCRA CI — Spec Gate & Build

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: "-Xmx2g --enable-preview"

jobs:
  # ── Spec Gate (SDD Section 7A.4 — Required Status Check) ──────────────────
  spec-traceability-check:
    name: "SDD — Spec Traceability Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Spec Contract Tests (jmcra-spec-gate profile)
        run: mvn test -Pspec-gate --no-transfer-progress
        env:
          JMCRA_WEBHOOK_SECRET: test-secret
          JMCRA_LLM_PROVIDER: CLAUDE
          ANTHROPIC_API_KEY: test-key

      - name: Validate Traceability Matrix
        run: |
          chmod +x scripts/check-traceability.sh
          ./scripts/check-traceability.sh
        shell: bash

  # ── Catalog Integrity Guard (SDD Section 7A.5) ────────────────────────────
  catalog-integrity-check:
    name: "SDD — Catalog Integrity Hash Guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Run Catalog Integrity Tests
        run: mvn test -Pcatalog-integrity --no-transfer-progress
        env:
          JMCRA_WEBHOOK_SECRET: test-secret
          JMCRA_LLM_PROVIDER: CLAUDE
          ANTHROPIC_API_KEY: test-key

  # ── Full Build & Test ──────────────────────────────────────────────────────
  build-and-test:
    name: "Build & Unit Tests"
    runs-on: ubuntu-latest
    needs: [spec-traceability-check, catalog-integrity-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build and test
        run: mvn clean verify --no-transfer-progress
        env:
          JMCRA_WEBHOOK_SECRET: test-secret
          JMCRA_LLM_PROVIDER: CLAUDE
          ANTHROPIC_API_KEY: test-key
          SPRING_PROFILES_ACTIVE: test

      - name: Publish JaCoCo Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: target/site/jacoco/jacoco.xml

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ── Docker Build (main branch only) ────────────────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build fat JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg JAVA_VERSION=${{ env.JAVA_VERSION }} \
            -t ghcr.io/${{ github.repository }}/jmcra:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/jmcra:latest \
            .
